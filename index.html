<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>帆帆生日快乐 🎂</title>

<style>

/* =========================
   基础设置
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #071a36;
}


/* =========================
   视频
========================= */

.video-background {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    z-index: 0;

    background: #071a36;

    display: block;
}


/* =========================
   梦幻遮罩
========================= */

.overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(100,210,255,0.08),
            rgba(0,20,60,0.18)
        );
}


/* =========================
   星星
========================= */

.stars {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 3;

    pointer-events: none;
}

.star {

    position: absolute;

    color: white;

    font-size: 22px;

    text-shadow:
        0 0 5px white,
        0 0 15px #9eeaff,
        0 0 30px #66d8ff;

    animation:
        twinkle 2s ease-in-out infinite;
}


.star:nth-child(1) {
    top: 15%;
    left: 15%;
    font-size: 25px;
}

.star:nth-child(2) {
    top: 25%;
    right: 15%;
    font-size: 30px;
    animation-delay: .5s;
}

.star:nth-child(3) {
    top: 42%;
    left: 8%;
    font-size: 18px;
    animation-delay: 1s;
}

.star:nth-child(4) {
    top: 48%;
    right: 10%;
    font-size: 25px;
    animation-delay: 1.5s;
}

.star:nth-child(5) {
    top: 65%;
    left: 18%;
    font-size: 20px;
    animation-delay: .8s;
}

.star:nth-child(6) {
    top: 72%;
    right: 18%;
    font-size: 28px;
    animation-delay: 1.2s;
}

.star:nth-child(7) {
    top: 12%;
    left: 50%;
    font-size: 16px;
    animation-delay: .3s;
}

.star:nth-child(8) {
    top: 82%;
    left: 50%;
    font-size: 20px;
    animation-delay: 1.7s;
}


@keyframes twinkle {

    0%,
    100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}


/* =========================
   生日文字
========================= */

#birthdayMessage {

    position: fixed;

    top: 20%;
    left: 50%;

    width: 90%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 5;

    transition:
        opacity .8s ease,
        transform .8s ease;
}


/* =========================
   帆帆
========================= */

.name {

    font-family:
        "STKaiti",
        "KaiTi",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: clamp(
        60px,
        16vw,
        110px
    );

    font-weight: 900;

    font-style: italic;

    color: #e3f8ff;

    letter-spacing: 10px;

    margin-bottom: 12px;

    text-shadow:
        0 0 5px white,
        0 0 12px #d9f7ff,
        0 0 25px #9de9ff,
        0 0 45px #65d7ff,
        0 0 70px #45c9ff;

    animation:
        nameGlow 2.2s ease-in-out infinite;
}


@keyframes nameGlow {

    0%,
    100% {

        transform: scale(1);

        text-shadow:
            0 0 5px white,
            0 0 12px #d9f7ff,
            0 0 25px #9de9ff,
            0 0 45px #65d7ff;
    }

    50% {

        transform: scale(1.08);

        text-shadow:
            0 0 8px white,
            0 0 18px #eaffff,
            0 0 35px #9de9ff,
            0 0 55px #65d7ff;
    }
}


/* =========================
   生日快乐
========================= */

.birthday {

    font-family:
        "STKaiti",
        "KaiTi",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: clamp(
        40px,
        10vw,
        75px
    );

    font-weight: 900;

    font-style: italic;

    color: #d9f6ff;

    letter-spacing: 7px;

    text-shadow:
        0 0 5px white,
        0 0 12px #c4f1ff,
        0 0 25px #80ddff,
        0 0 40px #5bcaff;

    animation:
        birthdayGlow 2.5s ease-in-out infinite;
}


@keyframes birthdayGlow {

    0%,
    100% {
        opacity: .9;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   点击播放按钮
========================= */

#playButton {

    position: fixed;

    left: 50%;
    bottom: 9%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 16px 35px;

    border: 2px solid rgba(255,255,255,.9);

    border-radius: 50px;

    background:
        rgba(225,248,255,.92);

    color: #357bb8;

    font-size: 19px;

    font-weight: bold;

    letter-spacing: 3px;

    box-shadow:
        0 0 10px white,
        0 0 25px #9ce8ff,
        0 0 45px #55d0ff;

    transition:
        transform .25s ease,
        opacity .8s ease;
}


#playButton:active {

    transform:
        translateX(-50%)
        scale(.92);
}


/* =========================
   点击之后隐藏
========================= */

.hide {

    opacity: 0 !important;

    pointer-events: none;

    transform:
        translateX(-50%)
        scale(.8) !important;
}


#birthdayMessage.hide {

    transform:
        translateX(-50%)
        scale(.8) !important;
}


/* =========================
   手机屏幕
========================= */

@media screen and (max-width:600px) {

    #birthdayMessage {

        top: 18%;
    }

    #playButton {

        bottom: 8%;

        padding:
            14px 28px;

        font-size: 18px;
    }
}

</style>
</head>


<body>


<!-- =========================
     视频
========================= -->

<video
    id="backgroundVideo"
    class="video-background"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    x5-playsinline
    preload="auto">

    <source
        src="birthday.mp4"
        type="video/mp4">

</video>


<!-- 梦幻遮罩 -->

<div class="overlay"></div>


<!-- =========================
     星光
========================= -->

<div class="stars">

    <div class="star">✦</div>

    <div class="star">✦</div>

    <div class="star">✧</div>

    <div class="star">✦</div>

    <div class="star">✧</div>

    <div class="star">✦</div>

    <div class="star">✧</div>

    <div class="star">✦</div>

</div>


<!-- =========================
     生日文字
========================= -->

<div id="birthdayMessage">

    <div class="name">
        帆帆
    </div>

    <div class="birthday">
        生日快乐
    </div>

</div>


<!-- =========================
     音乐
========================= -->

<audio
    id="music1"
    loop
    preload="auto">

    <source
        src="https://music.163.com/song/media/outer/url?id=1963443271.mp3"
        type="audio/mpeg">

</audio>


<!-- =========================
     播放按钮
========================= -->

<button id="playButton">

    ✨ 点击播放 ✨

</button>


<script>

/* =========================
   获取元素
========================= */

const video =
    document.getElementById(
        "backgroundVideo"
    );

const music =
    document.getElementById(
        "music1"
    );

const button =
    document.getElementById(
        "playButton"
    );

const message =
    document.getElementById(
        "birthdayMessage"
    );


/* =========================
   页面加载后尝试播放视频
========================= */

window.addEventListener(
    "load",
    function () {

        video.play().catch(
            function (error) {

                console.log(
                    "视频等待用户操作：",
                    error
                );

            }
        );

    }
);


/* =========================
   点击播放
========================= */

button.addEventListener(
    "click",
    function () {

        /* 播放视频 */

        video.play().catch(
            function (error) {

                console.log(
                    "视频播放失败：",
                    error
                );

            }
        );


        /* 播放音乐 */

        music.play().catch(
            function (error) {

                console.log(
                    "音乐播放失败：",
                    error
                );

            }
        );


        /* 隐藏生日文字 */

        message.classList.add(
            "hide"
        );


        /* 隐藏按钮 */

        button.classList.add(
            "hide"
        );

    }
);

</script>

</body>
</html>
