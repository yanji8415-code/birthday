<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>帆帆生日快乐 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07152f;
        }

        /* =========================
           背景视频
        ========================= */

        .video-background {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 100vw;
            height: 100vh;

            transform: translate(-50%, -50%);

            object-fit: cover;

            z-index: 0;

            background: #07152f;
        }

        /* =========================
           竖屏：旋转视频铺满
        ========================= */

        @media screen and (orientation: portrait) {

            .video-background {
                width: 100vh;
                height: 100vw;

                transform:
                    translate(-50%, -50%)
                    rotate(90deg);

                object-fit: cover;
            }
        }

        /* =========================
           半透明梦幻遮罩
        ========================= */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(120, 210, 255, 0.12),
                    rgba(0, 0, 30, 0.35)
                );

            z-index: 1;

            pointer-events: none;
        }

        /* =========================
           生日文字区域
        ========================= */

        #birthdayMessage {
            position: fixed;

            top: 22%;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            text-align: center;

            z-index: 5;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        /* 帆帆 */

        .name {
            font-family:
                "STKaiti",
                "KaiTi",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-size: clamp(58px, 15vw, 110px);

            font-weight: 900;

            font-style: italic;

            color: #e4f8ff;

            letter-spacing: 10px;

            margin-bottom: 12px;

            text-shadow:
                0 0 5px #ffffff,
                0 0 12px #d8f7ff,
                0 0 25px #9ee8ff,
                0 0 45px #67d7ff,
                0 0 70px #4fc3ff;

            animation:
                cuteGlow 2.2s ease-in-out infinite;
        }

        /* 生日快乐 */

        .birthday {
            font-family:
                "STKaiti",
                "KaiTi",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-size: clamp(38px, 9vw, 70px);

            font-weight: 900;

            font-style: italic;

            color: #d8f5ff;

            letter-spacing: 7px;

            text-shadow:
                0 0 5px #ffffff,
                0 0 12px #bcefff,
                0 0 25px #7ddcff,
                0 0 40px #5ecbff;

            animation:
                birthdayGlow 2.5s ease-in-out infinite;
        }

        /* =========================
           帆帆呼吸发光
        ========================= */

        @keyframes cuteGlow {

            0%,
            100% {
                transform: scale(1);

                text-shadow:
                    0 0 5px #ffffff,
                    0 0 12px #d8f7ff,
                    0 0 25px #9ee8ff,
                    0 0 45px #67d7ff;
            }

            50% {
                transform: scale(1.08);

                text-shadow:
                    0 0 8px #ffffff,
                    0 0 18px #e8fbff,
                    0 0 35px #9ee8ff,
                    0 0 55px #67d7ff,
                    0 0 75px #4fc3ff;
            }
        }

        /* =========================
           生日快乐发光
        ========================= */

        @keyframes birthdayGlow {

            0%,
            100% {
                opacity: 0.9;

                text-shadow:
                    0 0 5px #ffffff,
                    0 0 12px #bcefff,
                    0 0 25px #7ddcff;
            }

            50% {
                opacity: 1;

                text-shadow:
                    0 0 8px #ffffff,
                    0 0 18px #d9f8ff,
                    0 0 35px #79dcff,
                    0 0 50px #5ecbff;
            }
        }

        /* =========================
           星光
        ========================= */

        .stars {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 4;

            pointer-events: none;
        }

        .star {
            position: absolute;

            color: #ffffff;

            font-size: 20px;

            text-shadow:
                0 0 6px #ffffff,
                0 0 15px #8ee5ff,
                0 0 25px #62d7ff;

            animation:
                starTwinkle 2s ease-in-out infinite;
        }

        .star:nth-child(1) {
            top: 15%;
            left: 15%;
            font-size: 25px;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            top: 23%;
            right: 14%;
            font-size: 32px;
            animation-delay: 0.5s;
        }

        .star:nth-child(3) {
            top: 40%;
            left: 8%;
            font-size: 18px;
            animation-delay: 1s;
        }

        .star:nth-child(4) {
            top: 45%;
            right: 10%;
            font-size: 23px;
            animation-delay: 1.5s;
        }

        .star:nth-child(5) {
            top: 65%;
            left: 18%;
            font-size: 20px;
            animation-delay: 0.7s;
        }

        .star:nth-child(6) {
            top: 70%;
            right: 18%;
            font-size: 28px;
            animation-delay: 1.2s;
        }

        .star:nth-child(7) {
            top: 12%;
            left: 48%;
            font-size: 16px;
            animation-delay: 0.3s;
        }

        .star:nth-child(8) {
            top: 80%;
            left: 50%;
            font-size: 18px;
            animation-delay: 1.7s;
        }

        @keyframes starTwinkle {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.5) rotate(45deg);
            }
        }

        /* =========================
           点击播放按钮
        ========================= */

        #playButton {
            position: fixed;

            left: 50%;
            bottom: 10%;

            transform: translateX(-50%);

            z-index: 10;

            padding: 16px 38px;

            border: 2px solid rgba(255, 255, 255, 0.8);

            border-radius: 50px;

            background:
                rgba(220, 248, 255, 0.88);

            color: #3478b8;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 3px;

            box-shadow:
                0 0 10px #ffffff,
                0 0 25px #9ee8ff,
                0 0 45px rgba(92, 210, 255, 0.8);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        #playButton:active {
            transform:
                translateX(-50%)
                scale(0.92);
        }

        #playButton:hover {
            box-shadow:
                0 0 15px #ffffff,
                0 0 30px #9ee8ff,
                0 0 60px #62d7ff;
        }

        /* =========================
           点击后隐藏
        ========================= */

        .hide {
            opacity: 0 !important;

            transform:
                translateX(-50%)
                scale(0.8) !important;

            pointer-events: none;
        }

        #birthdayMessage.hide {
            transform:
                translateX(-50%)
                scale(0.8) !important;
        }

        /* =========================
           手机竖屏按钮调整
        ========================= */

        @media screen and (orientation: portrait) {

            #birthdayMessage {
                top: 18%;
            }

            #playButton {
                bottom: 8%;

                padding: 14px 30px;

                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         背景视频
    ========================= -->

    <video
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        x5-playsinline
        preload="auto">

        <source
            src="birthday.mp4"
            type="video/mp4">

    </video>


    <!-- 梦幻遮罩 -->

    <div class="overlay"></div>


    <!-- =========================
         星光
    ========================= -->

    <div class="stars">

        <div class="star">✦</div>
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>

    </div>


    <!-- =========================
         生日文字
    ========================= -->

    <div id="birthdayMessage">

        <div class="name">
            帆帆
        </div>

        <div class="birthday">
            生日快乐
        </div>

    </div>


    <!-- =========================
         音乐
    ========================= -->

    <audio
        id="music1"
        loop
        preload="auto">

        <source
            src="https://music.163.com/song/media/outer/url?id=1963443271.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =========================
         播放按钮
    ========================= -->

    <button id="playButton">
        ✨ 点击播放 ✨
    </button>


    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        const playButton =
            document.getElementById("playButton");

        const music =
            document.getElementById("music1");

        const birthdayMessage =
            document.getElementById("birthdayMessage");


        playButton.addEventListener("click", function () {

            /* 播放音乐 */

            music.play().catch(function (error) {
                console.log("音乐播放失败:", error);
            });


            /* 隐藏生日文字 */

            birthdayMessage.classList.add("hide");


            /* 隐藏播放按钮 */

            playButton.classList.add("hide");

        });


        /* =========================
           页面点击也尝试播放
        ========================= */

        document.body.addEventListener(
            "click",
            function () {

                if (music.paused) {

                    music.play().catch(function () {});

                }

            },
            {
                once: true
            }
        );

    </script>

</body>
</html>
