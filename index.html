<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: block;
        }

        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(240, 17, 155);
            font-size: 0.5rem;
            font-family: 华文彩云, sans-serif;
            text-align: center;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay muted loop playsinline webkit-playsinline>
        <source src="birthday.mp4" type="video/mp4">
        你的浏览器不支持视频播放。
    </video>

    <audio id="music1" loop preload="auto">
        <source src="https://music.163.com/song/media/outer/url?id=1963443271.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('click', function () {
            var myAudio = document.getElementById('music1');
            if (myAudio) {
                myAudio.play().catch(function () {});
            }
        }, { once: true });
    </script>

    <div class="content"></div>

</body>
</html>
