<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>帆帆生日快乐</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }


        /* =========================
           原来的视频设置，不改变视频
        ========================= */

        .video-background {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 100vh;
            height: 100vw;

            transform:
                translate(-50%, -50%)
                rotate(90deg);

            transform-origin: center center;

            object-fit: cover;

            z-index: 0;

            background: #000;
        }


        /* =========================
           生日文字
        ========================= */

        #birthdayMessage {

            position: fixed;

            top: 20%;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            text-align: center;

            z-index: 5;

            pointer-events: none;

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        /* 帆帆 */

        .name {

            font-family:
                "STKaiti",
                "KaiTi",
                "Microsoft YaHei",
                sans-serif;

            font-size: 70px;

            font-weight: 900;

            font-style: italic;

            color: #dff8ff;

            letter-spacing: 12px;

            margin-bottom: 12px;

            text-shadow:

                0 0 5px #ffffff,

                0 0 12px #d8f7ff,

                0 0 25px #9ce8ff,

                0 0 45px #65d7ff,

                0 0 70px #55cfff;

            animation:
                nameGlow 2s ease-in-out infinite;
        }


        /* 生日快乐 */

        .birthday {

            font-family:
                "STKaiti",
                "KaiTi",
                "Microsoft YaHei",
                sans-serif;

            font-size: 45px;

            font-weight: 900;

            font-style: italic;

            color: #d8f5ff;

            letter-spacing: 8px;

            text-shadow:

                0 0 5px #ffffff,

                0 0 12px #c8f2ff,

                0 0 25px #80dcff,

                0 0 45px #55cfff;

            animation:
                birthdayGlow 2.5s ease-in-out infinite;
        }


        /* =========================
           帆帆发光动画
        ========================= */

        @keyframes nameGlow {

            0%,
            100% {

                transform: scale(1);

                text-shadow:

                    0 0 5px #ffffff,

                    0 0 12px #d8f7ff,

                    0 0 25px #9ce8ff,

                    0 0 45px #65d7ff;
            }

            50% {

                transform: scale(1.08);

                text-shadow:

                    0 0 8px #ffffff,

                    0 0 18px #eaffff,

                    0 0 35px #9ce8ff,

                    0 0 55px #55cfff,

                    0 0 75px #55cfff;
            }
        }


        /* =========================
           生日快乐发光
        ========================= */

        @keyframes birthdayGlow {

            0%,
            100% {

                opacity: 0.85;

            }

            50% {

                opacity: 1;

            }
        }


        /* =========================
           星光
        ========================= */

        .stars {

            position: fixed;

            inset: 0;

            z-index: 4;

            pointer-events: none;
        }


        .star {

            position: absolute;

            color: white;

            font-size: 22px;

            text-shadow:

                0 0 6px #ffffff,

                0 0 15px #9eeaff,

                0 0 30px #55d5ff;

            animation:
                starTwinkle 2s ease-in-out infinite;
        }


        .star:nth-child(1) {
            top: 14%;
            left: 15%;
            font-size: 25px;
        }

        .star:nth-child(2) {
            top: 23%;
            right: 15%;
            font-size: 30px;
            animation-delay: .4s;
        }

        .star:nth-child(3) {
            top: 38%;
            left: 8%;
            font-size: 18px;
            animation-delay: .8s;
        }

        .star:nth-child(4) {
            top: 45%;
            right: 10%;
            font-size: 25px;
            animation-delay: 1.2s;
        }

        .star:nth-child(5) {
            top: 65%;
            left: 18%;
            font-size: 20px;
            animation-delay: .6s;
        }

        .star:nth-child(6) {
            top: 72%;
            right: 18%;
            font-size: 28px;
            animation-delay: 1.5s;
        }


        @keyframes starTwinkle {

            0%,
            100% {

                opacity: 0.25;

                transform:
                    scale(.7)
                    rotate(0deg);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.5)
                    rotate(45deg);
            }
        }


        /* =========================
           播放按钮
        ========================= */

        #startButton {

            position: fixed;

            left: 50%;

            bottom: 40px;

            transform: translateX(-50%);

            z-index: 10;

            padding: 14px 30px;

            border: 2px solid rgba(255,255,255,.8);

            border-radius: 30px;

            background:
                rgba(225,248,255,.92);

            color: #397eb5;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 3px;

            box-shadow:

                0 0 10px #ffffff,

                0 0 25px #9eeaff,

                0 0 45px #55d5ff;

            transition:

                opacity 1s ease,

                transform 1s ease;
        }


        /* =========================
           点击后隐藏
        ========================= */

        .hide {

            opacity: 0 !important;

            transform:
                translateX(-50%)
                scale(.8) !important;

            pointer-events: none;
        }


        /* =========================
           横屏保持原来的视频方式
        ========================= */

        @media (orientation: landscape) {

            .video-background {

                width: 100vw;

                height: 100vh;

                transform:
                    translate(-50%, -50%);

                object-fit: cover;
            }
        }


        /* =========================
           手机竖屏
        ========================= */

        @media (max-width: 600px) {

            #birthdayMessage {

                top: 18%;
            }

            .name {

                font-size: 58px;

                letter-spacing: 9px;
            }

            .birthday {

                font-size: 38px;

                letter-spacing: 6px;
            }

            #startButton {

                bottom: 35px;

                font-size: 17px;

                padding:
                    13px 26px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         视频：完全保留原来的设置
    ========================= -->

    <video
        id="birthdayVideo"
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        x5-playsinline
        preload="auto">

        <source
            src="birthday.mp4"
            type="video/mp4">

    </video>


    <!-- =========================
         音乐：保持原来的音乐
    ========================= -->

    <audio
        id="music1"
        loop
        preload="auto">

        <source
            src="https://music.163.com/song/media/outer/url?id=1963443271.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =========================
         星光
    ========================= -->

    <div class="stars">

        <div class="star">✦</div>

        <div class="star">✦</div>

        <div class="star">✧</div>

        <div class="star">✦</div>

        <div class="star">✧</div>

        <div class="star">✦</div>

    </div>


    <!-- =========================
         生日文字
    ========================= -->

    <div id="birthdayMessage">

        <div class="name">
            帆帆
        </div>

        <div class="birthday">
            生日快乐
        </div>

    </div>


    <!-- =========================
         播放按钮
    ========================= -->

    <button id="startButton">
        ✨ 点击播放 ✨
    </button>


    <script>

        (function () {

            var video =
                document.getElementById(
                    'birthdayVideo'
                );

            var audio =
                document.getElementById(
                    'music1'
                );

            var button =
                document.getElementById(
                    'startButton'
                );

            var message =
                document.getElementById(
                    'birthdayMessage'
                );


            /* 点击播放 */

            function startMedia() {

                /* 视频保持原来的播放方式 */

                video.muted = true;

                var vp =
                    video.play();

                if (
                    vp &&
                    vp.catch
                ) {

                    vp.catch(
                        function () {}
                    );
                }


                /* 播放音乐 */

                var ap =
                    audio.play();

                if (
                    ap &&
                    ap.catch
                ) {

                    ap.catch(
                        function () {}
                    );
                }


                /* 隐藏帆帆和生日快乐 */

                message.classList.add(
                    'hide'
                );


                /* 隐藏按钮 */

                button.classList.add(
                    'hide'
                );

            }


            /* 点击按钮 */

            button.addEventListener(
                'click',
                startMedia
            );


            /* 自动尝试播放视频 */

            var p =
                video.play();

            if (
                p &&
                p.catch
            ) {

                p.catch(
                    function () {

                        button.style.display =
                            'block';

                    }
                );
            }

        })();

    </script>

</body>

</html>
