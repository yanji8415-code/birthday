<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            background: #000;
        }

        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #startButton {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            z-index: 10;
            padding: 12px 24px;
            border: 0;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <video
        id="birthdayVideo"
        class="video-background"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        x5-playsinline
        preload="auto"
        poster="">
        <source src="birthday.mp4" type="video/mp4">
    </video>

    <audio id="music1" loop preload="auto">
        <source src="https://music.163.com/song/media/outer/url?id=1963443271.mp3" type="audio/mpeg">
    </audio>

    <button id="startButton">点击播放</button>

    <div class="content"></div>

    <script>
        (function () {
            var video = document.getElementById('birthdayVideo');
            var audio = document.getElementById('music1');
            var button = document.getElementById('startButton');

            function startMedia() {
                video.muted = true;
                var videoPromise = video.play();

                if (videoPromise && videoPromise.catch) {
                    videoPromise.catch(function () {});
                }

                var audioPromise = audio.play();
                if (audioPromise && audioPromise.catch) {
                    audioPromise.catch(function () {});
                }

                button.style.display = 'none';
            }

            video.addEventListener('error', function () {
                button.textContent = '视频加载失败，请检查 birthday.mp4';
                button.style.display = 'block';
            });

            button.addEventListener('click', startMedia);
            document.addEventListener('click', function () {
                if (button.style.display !== 'none') {
                    startMedia();
                }
            }, { once: true });

            // 尝试静音自动播放视频；手机浏览器若阻止，则等待用户点击。
            var p = video.play();
            if (p && p.catch) {
                p.catch(function () {
                    button.style.display = 'block';
                });
            }
        })();
    </script>

</body>
</html>
